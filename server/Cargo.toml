[package]
name = "budzet-server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
getrandom = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "set-header", "limit"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Mały i szybki plik wykonywalny. „thin” LTO zamiast pełnego – dużo mniej RAM przy kompilacji.
[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
